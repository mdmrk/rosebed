when:
  event: [push, pull_request]

steps:
  - name: install-zig
    image: debian:bookworm-slim
    commands:
      - apt-get update -qq && apt-get install -y -qq curl xz-utils ca-certificates
      - curl -sL -o /tmp/zig.tar.xz https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz
      - tar -xJf /tmp/zig.tar.xz -C .
      - mv zig-x86_64-linux-0.16.0 zig-toolchain

  - name: test
    image: debian:bookworm-slim
    commands:
      - export PATH="$PWD/zig-toolchain:$PATH"
      - zig build test --summary all

  - name: build
    image: debian:bookworm-slim
    commands:
      - export PATH="$PWD/zig-toolchain:$PATH"
      - zig build --summary all
