                const TILE = 32;
                const DIRT_TINT = "#404040";
                const SHADOW = "#3f3f3f";
                const BAR_BACKGROUND = "#808080";
                const BAR_FILL = "#80ff80";
                const BAR_WIDTH = 100;
                const BAR_HEIGHT = 2;

                const loading = document.getElementById("loading");
                const ctx = loading.getContext("2d");

                let dirt = null;
                let glyphs = null;
                let shadowGlyphs = null;
                let widths = null;
                let message = "Loading...";
                let progress = 0;
                let peak = 0;
                let gone = false;

                const paint = (image, width, height, op, color) => {
                    const buffer = document.createElement("canvas");
                    buffer.width = width;
                    buffer.height = height;
                    const g = buffer.getContext("2d");
                    g.imageSmoothingEnabled = false;
                    g.drawImage(image, 0, 0, width, height);
                    if (op) {
                        g.globalCompositeOperation = op;
                        g.fillStyle = color;
                        g.fillRect(0, 0, width, height);
                    }
                    return buffer;
                };

                const measure = (atlas) => {
                    const g = paint(atlas, 128, 128).getContext("2d");
                    const px = g.getImageData(0, 0, 128, 128).data;
                    const table = new Uint8Array(256);
                    for (let c = 0; c < 256; c++) {
                        const cx = (c % 16) * 8;
                        const cy = (c >> 4) * 8;
                        let right = -1;
                        for (let x = 7; x >= 0 && right < 0; x--) {
                            for (let y = 0; y < 8; y++) {
                                if (px[((cy + y) * 128 + cx + x) * 4 + 3] > 0) {
                                    right = x;
                                    break;
                                }
                            }
                        }
                        table[c] = (c === 32 ? 2 : right) + 2;
                    }
                    return table;
                };

                const stringWidth = (text) => {
                    let total = 0;
                    for (let i = 0; i < text.length; i++) {
                        total += widths[text.charCodeAt(i) & 255];
                    }
                    return total;
                };

                const blit = (atlas, text, x, y) => {
                    for (let i = 0; i < text.length; i++) {
                        const c = text.charCodeAt(i) & 255;
                        ctx.drawImage(
                            atlas,
                            (c % 16) * 8,
                            (c >> 4) * 8,
                            8,
                            8,
                            x,
                            y,
                            8,
                            8,
                        );
                        x += widths[c];
                    }
                };

                const centered = (text, width, y) => {
                    const x = Math.floor((width - stringWidth(text)) / 2);
                    blit(shadowGlyphs, text, x + 1, y + 1);
                    blit(glyphs, text, x, y);
                };

                const draw = () => {
                    if (gone || !dirt || !glyphs) return;

                    const dpr = window.devicePixelRatio || 1;
                    const pw = Math.round(window.innerWidth * dpr);
                    const ph = Math.round(window.innerHeight * dpr);
                    if (loading.width !== pw || loading.height !== ph) {
                        loading.width = pw;
                        loading.height = ph;
                    }

                    let factor = 1;
                    while (
                        factor < 1000 &&
                        Math.floor(pw / (factor + 1)) >= 320 &&
                        Math.floor(ph / (factor + 1)) >= 240
                    ) {
                        factor++;
                    }
                    const width = Math.ceil(pw / factor);
                    const height = Math.ceil(ph / factor);

                    ctx.setTransform(factor, 0, 0, factor, 0, 0);
                    ctx.imageSmoothingEnabled = false;
                    ctx.fillStyle = ctx.createPattern(dirt, "repeat");
                    ctx.fillRect(0, 0, width, height);

                    const cx = Math.floor(width / 2);
                    const cy = Math.floor(height / 2);

                    const barX = cx - BAR_WIDTH / 2;
                    const barY = cy + 16;
                    ctx.fillStyle = BAR_BACKGROUND;
                    ctx.fillRect(barX, barY, BAR_WIDTH, BAR_HEIGHT);
                    ctx.fillStyle = BAR_FILL;
                    ctx.fillRect(
                        barX,
                        barY,
                        Math.round(BAR_WIDTH * progress),
                        BAR_HEIGHT,
                    );

                    centered(message, width, cy - 4 + 8);
                };

                const ready = (src, done) => {
                    const image = new Image();
                    image.onload = () => {
                        done(image);
                        draw();
                    };
                    image.src = src;
                };

                ready(DIRT_PNG, (image) => {
                    dirt = paint(image, TILE, TILE, "multiply", DIRT_TINT);
                });
                ready(FONT_PNG, (image) => {
                    widths = measure(image);
                    glyphs = image;
                    shadowGlyphs = paint(image, 128, 128, "source-in", SHADOW);
                });

                window.addEventListener("resize", draw);

                return {
                    canvas: document.getElementById("canvas"),

                    monitorRunDependencies: (remaining) => {
                        peak = Math.max(peak, remaining);
                        if (peak) progress = (peak - remaining) / peak;
                        draw();
                    },

                    setStatus: (text) => {
                        if (!text) {
                            gone = true;
                            loading.style.opacity = 0;
                            setTimeout(() => loading.remove(), 250);
                            return;
                        }
                        const parts = /^(.*?)\((\d+(?:\.\d+)?)\/(\d+)\)/.exec(
                            text,
                        );
                        if (parts) {
                            message = parts[1].trim();
                            progress = +parts[2] / +parts[3];
                        } else {
                            message = text;
                        }
                        message = message.replace(/[^\x20-\x7e]/g, "");
                        draw();
                    },
                };
            })();
