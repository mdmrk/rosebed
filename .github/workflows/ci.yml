name: ci
on:
  push:
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
          - os: windows-latest
            name: windows-x86_64
          - os: macos-latest
            name: macos-aarch64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: setup zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: seed freetype tarball
        run: zig fetch https://downloads.sourceforge.net/project/freetype/freetype2/2.14.3/freetype-2.14.3.tar.xz
      - name: fetch assets
        run: zig build fetch-assets
      - name: test
        run: zig build test
      - name: build
        run: |
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            zig build -Doptimize=ReleaseFast
          else
            zig build -Doptimize=ReleaseFast -Dcpu=x86_64_v3
          fi
      - name: package
        run: |
          mkdir -p dist
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            7z a "dist/rosebed-${{ matrix.name }}.zip" ./zig-out/bin/rosebed.exe ./zig-out/bin/rosebed-server.exe
          else
            tar -czf "dist/rosebed-${{ matrix.name }}.tar.gz" -C zig-out/bin rosebed rosebed-server
          fi
      - name: upload
        uses: actions/upload-artifact@v4
        with:
          name: rosebed-${{ matrix.name }}
          path: dist/*
  web:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: setup zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: setup emsdk
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.8
          actions-cache-folder: emsdk-cache
      - name: patch zig std for emscripten
        run: |
          lib_dir=$(zig env | sed -n 's/^ *\.lib_dir = "\(.*\)",$/\1/p')
          cp -r "$lib_dir" ziglib
          chmod -R u+w ziglib
          patch -p1 -d ziglib < .github/zig-emscripten.patch
      - name: seed freetype tarball
        run: zig fetch https://downloads.sourceforge.net/project/freetype/freetype2/2.14.3/freetype-2.14.3.tar.xz
      - name: fetch assets
        run: zig build fetch-assets
      - name: build
        run: |
          zig build \
            -Dtarget=wasm32-emscripten \
            -Doptimize=ReleaseFast \
            --sysroot "$(em-config CACHE)/sysroot" \
            --zig-lib-dir ziglib
      - name: upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: zig-out/www
  pages:
    if: github.event_name != 'pull_request'
    needs: web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: deploy
        id: deployment
        uses: actions/deploy-pages@v4
  nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --cleanup-tag --yes || true
          gh release create nightly dist/* \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title nightly \
            --notes "nightly build of ${GITHUB_SHA:0:7}"
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
