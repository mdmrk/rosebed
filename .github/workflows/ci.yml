name: ci
on:
  push:
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "37 5 * * *"
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - name: check for changes since the last nightly
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh api "repos/${{ github.repository }}/commits/nightly" --jq .sha 2>/dev/null || true)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$last" = "$GITHUB_SHA" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
  build:
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: x86_64-linux
          - os: windows-latest
            name: x86_64-windows
          - os: macos-latest
            name: aarch64-macos
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: setup zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: seed freetype package
        run: |
          pkg=zig-pkg/N-V-__8AAJo-LAHFNfa0p0oMQqmwlBEAZMOeo03azXgrKLTT
          mkdir -p "$pkg"
          curl -fsSL https://downloads.sourceforge.net/project/freetype/freetype2/2.14.3/freetype-2.14.3.tar.xz -o freetype.tar.xz
          tar -xJf freetype.tar.xz --strip-components=1 -C "$pkg"
          rm freetype.tar.xz
      - name: fetch assets
        run: zig build fetch-assets
      - name: test
        run: zig build test
      - name: build
        run: |
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            zig build -Doptimize=fast
          else
            zig build -Doptimize=fast -Dcpu=x86_64_v3
          fi
      - name: package
        run: |
          mkdir -p dist
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            7z a "dist/rosebed-${{ matrix.name }}.zip" ./zig-out/bin/rosebed.exe ./zig-out/bin/rosebed-server.exe
          else
            tar -czf "dist/rosebed-${{ matrix.name }}.tar.gz" -C zig-out/bin rosebed rosebed-server
          fi
      - name: upload
        uses: actions/upload-artifact@v7
        with:
          name: rosebed-${{ matrix.name }}
          path: dist/*
  web:
    name: build (ubuntu-latest, wasm32-emscripten)
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: setup zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: setup emsdk
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: 6.0.13
          actions-cache-folder: emsdk-cache
      - name: patch zig std for emscripten
        run: |
          lib_dir=$(zig env | sed -n 's/^ *\.lib_dir = "\(.*\)",$/\1/p')
          cp -r "$lib_dir" ziglib
          chmod -R u+w ziglib
          patch -p1 -d ziglib < .github/zig-emscripten.patch
      - name: seed freetype package
        run: |
          pkg=zig-pkg/N-V-__8AAJo-LAHFNfa0p0oMQqmwlBEAZMOeo03azXgrKLTT
          mkdir -p "$pkg"
          curl -fsSL https://downloads.sourceforge.net/project/freetype/freetype2/2.14.3/freetype-2.14.3.tar.xz -o freetype.tar.xz
          tar -xJf freetype.tar.xz --strip-components=1 -C "$pkg"
          rm freetype.tar.xz
      - name: fetch assets
        run: zig build fetch-assets
      - name: build
        run: |
          ZIG_LIB_DIR="$PWD/ziglib" zig build \
            -Dtarget=wasm32-emscripten \
            -Doptimize=fast \
            --sysroot "$(em-config CACHE)/sysroot" \
            -Demscripten-sysroot="$(em-config CACHE)/sysroot"
      - name: package
        run: |
          mkdir -p dist
          tar -czf dist/rosebed-wasm32-emscripten.tar.gz -C zig-out/www .
      - name: upload
        uses: actions/upload-artifact@v7
        with:
          name: rosebed-wasm32-emscripten
          path: dist/*
      - name: upload pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: zig-out/www
  android:
    name: build (ubuntu-latest, aarch64-linux-android)
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: setup zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: seed freetype package
        run: |
          pkg=zig-pkg/N-V-__8AAJo-LAHFNfa0p0oMQqmwlBEAZMOeo03azXgrKLTT
          mkdir -p "$pkg"
          curl -fsSL https://downloads.sourceforge.net/project/freetype/freetype2/2.14.3/freetype-2.14.3.tar.xz -o freetype.tar.xz
          tar -xJf freetype.tar.xz --strip-components=1 -C "$pkg"
          rm freetype.tar.xz
      - name: fetch assets
        run: zig build fetch-assets
      - name: fetch sdl for android
        run: zig build fetch-android-sdl
      - name: build
        run: |
          zig build \
            -Dtarget=aarch64-linux-android \
            -Doptimize=fast \
            -Dandroid-ndk="$ANDROID_NDK_ROOT" \
            -Dandroid-sdk="$ANDROID_HOME" \
            -Dandroid-build-tools="$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)" \
            -Dandroid-platform="$(ls "$ANDROID_HOME/platforms" | sort -V | tail -1)"
      - name: package
        run: |
          mkdir -p dist
          cp zig-out/rosebed.apk dist/rosebed-aarch64-linux-android.apk
      - name: upload
        uses: actions/upload-artifact@v7
        with:
          name: rosebed-aarch64-linux-android
          path: dist/*
  ios:
    name: build (macos-latest, aarch64-ios)
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: macos-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: setup zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: seed freetype package
        run: |
          pkg=zig-pkg/N-V-__8AAJo-LAHFNfa0p0oMQqmwlBEAZMOeo03azXgrKLTT
          mkdir -p "$pkg"
          curl -fsSL https://downloads.sourceforge.net/project/freetype/freetype2/2.14.3/freetype-2.14.3.tar.xz -o freetype.tar.xz
          tar -xJf freetype.tar.xz --strip-components=1 -C "$pkg"
          rm freetype.tar.xz
      - name: fetch assets
        run: zig build fetch-assets
      - name: fetch sdl for ios
        run: zig build fetch-ios-sdl
      - name: build
        run: |
          zig build \
            -Dtarget=aarch64-ios \
            -Doptimize=fast \
            -Dios-sdk="$(xcrun --sdk iphoneos --show-sdk-path)"
      - name: package
        run: |
          mkdir -p dist
          cp zig-out/rosebed.ipa dist/rosebed-aarch64-ios.ipa
      - name: upload
        uses: actions/upload-artifact@v7
        with:
          name: rosebed-aarch64-ios
          path: dist/*
  pages:
    if: github.event_name != 'pull_request'
    needs: web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: deploy
        id: deployment
        uses: actions/deploy-pages@v5
  nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: [build, web, android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: rosebed-*
          merge-multiple: true
      - name: publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="nightly build of ${GITHUB_SHA:0:7}"
          if gh release view nightly >/dev/null 2>&1; then
            gh release delete nightly --yes --cleanup-tag
          fi
          gh release create nightly --target "$GITHUB_SHA" --prerelease --title nightly --notes "$notes"
          gh release upload nightly dist/*
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, web, android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: rosebed-*
          merge-multiple: true
      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
